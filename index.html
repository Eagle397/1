<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacked By Eagle</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://i.pinimg.com/originals/51/ae/a3/51aea3393b8234a1e69d8713a0a58bc3.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Courier New', monospace;
      color: #0000ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    .image-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin-bottom: 40px;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      border: 3px solid #00f;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f;
      object-fit: contain;
    }

    .overlay-text {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2em;
      font-weight: bold;
      color: #00f;
      text-shadow: 0 0 10px #00f;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 5px;
    }

    .message {
      font-size: 1.8em;
      color: #0000ff;
      text-shadow: 0 0 10px #0000ff, 0 0 20px #0000ff;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .text {
      font-size: 3em;
      color: #0000ff;
      text-shadow: 0 0 10px #0000ff, 0 0 20px #0000ff;
      letter-spacing: 5px;
    }

    .emoji {
      font-size: 5em;
      margin-top: 25px;
      text-shadow: 0 0 10px #0000ff, 0 0 20px #0000ff;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <!-- Use your Eagle logo image link below -->
    <img src="https://via.placeholder.com/300x300.png?text=Eagle+Logo" alt="Eagle Logo">
    <div class="overlay-text">Made By Eagle</div>
  </div>

  <!-- Background music -->
  <audio autoplay loop>
    <source src="https://media1.vocaroo.com/mp3/1eYjADTAs7tm" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="message">This is just the beginning... 😂</div>
  <div class="text">Hacked By Eagle</div>
</body>
</html>
