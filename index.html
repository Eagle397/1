<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hacked By Eagle - Enhanced</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    /* Reset */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: 'Orbitron', 'Courier New', monospace;
      color: #00f0ff;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Background glitch noise and scan lines */
    body::before,
    body::after {
      content: "";
      pointer-events: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      mix-blend-mode: screen;
      opacity: 0.1;
      animation: noise 0.2s infinite;
    }

    body::before {
      background:
        repeating-linear-gradient(
          180deg,
          rgba(0,255,255,0.05),
          rgba(0,255,255,0.05) 1px,
          transparent 2px,
          transparent 3px
        );
      animation-duration: 0.15s;
    }

    body::after {
      background:
        url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif') repeat;
      animation-duration: 0.3s;
      opacity: 0.04;
      filter: grayscale(100%) contrast(150%);
      mix-blend-mode: overlay;
    }

    @keyframes noise {
      0%, 100% { transform: translate(0,0); }
      10% { transform: translate(-2px,-2px); }
      20% { transform: translate(2px,2px); }
      30% { transform: translate(-2px,2px); }
      40% { transform: translate(2px,-2px); }
      50% { transform: translate(-2px,0); }
      60% { transform: translate(2px,2px); }
      70% { transform: translate(-2px,-2px); }
      80% { transform: translate(2px,0); }
      90% { transform: translate(0,2px); }
    }

    /* Container with blur and glow */
    .container {
      position: relative;
      z-index: 1;
      max-width: 380px;
      margin: auto;
      padding: 40px 60px;
      background: rgba(0, 0, 40, 0.75);
      border-radius: 24px;
      border: 2px solid #00f0ff;
      box-shadow:
        0 0 40px #00ffffcc,
        0 0 80px #00ffffee;
      backdrop-filter: blur(14px);
      animation: fadeIn 1.8s ease forwards;
      text-align: center;
      user-select: none;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(40px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* Eagle Image + glowing rings */
    .image-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 40px;
      filter: drop-shadow(0 0 20px #00ffff);
    }

    .image-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid #00f0ff;
      object-fit: contain;
      animation: subtleRotate 15s linear infinite;
      filter: drop-shadow(0 0 12px #00f0ff);
      position: relative;
      z-index: 2;
    }

    @keyframes subtleRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg);}
    }

    /* Glowing rings around eagle */
    .ring {
      position: absolute;
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow:
        0 0 10px #00f0ff,
        0 0 20px #00f0ff,
        0 0 40px #00f0ff70;
      animation: pulseRing 3.6s ease-in-out infinite;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }
    .ring.small {
      width: 310px;
      height: 310px;
      animation-delay: 0s;
      opacity: 0.6;
    }
    .ring.medium {
      width: 340px;
      height: 340px;
      animation-delay: 1.2s;
      opacity: 0.4;
    }
    .ring.large {
      width: 370px;
      height: 370px;
      animation-delay: 2.4s;
      opacity: 0.25;
    }

    @keyframes pulseRing {
      0%, 100% {
        box-shadow:
          0 0 10px #00f0ff,
          0 0 20px #00f0ff,
          0 0 40px #00f0ff70;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        box-shadow:
          0 0 30px #00ffff,
          0 0 50px #00ffffcc,
          0 0 70px #00ffffdd;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    /* Flickering glitch text effect */
    .text {
      font-size: 3.6rem;
      font-weight: 900;
      letter-spacing: 8px;
      position: relative;
      color: #00ffff;
      text-shadow:
        0 0 15px #00ffff,
        0 0 30px #00ffffcc,
        0 0 50px #00ffffdd,
        0 0 70px #00ffffee;
      margin-bottom: 20px;
      animation: glitch 3s linear infinite;
      user-select: none;
    }

    @keyframes glitch {
      0% {
        text-shadow:
          2px 0 #00f0ff,
          -2px 0 #00ffff,
          0 0 8px #00ffff;
        color: #00f0ff;
      }
      20% {
        text-shadow:
          -2px 0 #00f0ff,
          2px 0 #00ffff,
          0 0 12px #00ffff;
        color: #00ffff;
      }
      40% {
        text-shadow:
          2px 2px #00f0ff,
          -2px -2px #00ffff,
          0 0 15px #00ffff;
        color: #00f0ff;
      }
      60% {
        text-shadow:
          -2px 2px #00f0ff,
          2px -2px #00ffff,
          0 0 15px #00ffff;
        color: #00ffff;
      }
      80%, 100% {
        text-shadow:
          2px 0 #00f0ff,
          -2px 0 #00ffff,
          0 0 8px #00ffff;
        color: #00f0ff;
      }
    }

    /* Message with glitch flicker */
    .message {
      font-size: 1.8rem;
      font-weight: 600;
      color: #00dfff;
      margin-bottom: 15px;
      text-shadow:
        0 0 10px #00dfff,
        0 0 25px #00dfffaa,
        0 0 40px #00dfff88;
      animation: flicker 4s linear infinite alternate;
      user-select: none;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Made By Eagle tag with glitch */
    .overlay-text {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1.8px;
      color: #00ffff;
      text-shadow:
        0 0 8px #00ffff,
        0 0 16px #00ffff,
        0 0 24px #00ffffcc;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 20px;
      border-radius: 12px;
      pointer-events: none;
      animation: glitchTag 2.8s infinite;
      user-select: none;
    }

    @keyframes glitchTag {
      0%, 100% { text-shadow: 0 0 8px #00ffff; }
      20% { text-shadow: -2px 0 8px #00f0ff, 2px 0 8px #00ffff; }
      40% { text-shadow: 2px 0 8px #00f0ff, -2px 0 8px #00ffff; }
      60% { text-shadow: -1px 1px 10px #00dfff, 1px -1px 12px #00ffff; }
      80% { text-shadow: 1px -1px 12px #00dfff, -1px 1px 12px #00ffff; }
    }

    /* Emoji floating */
    .emoji {
      font-size: 6.5rem;
      margin-top: 25px;
      text-shadow:
        0 0 15px #00ffff,
        0 0 30px #00ffffcc,
        0 0 50px #00ffffdd;
      animation: floatUpDown 4s ease-in-out infinite alternate;
      user-select: none;
    }

    @keyframes floatUpDown {
      0% { transform: translateY(0); }
      100% { transform: translateY(-18px); }
    }

    /* Audio controls toggle button */
    .audio-control {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00f0ff;
      background: transparent;
      border: 2px solid #00f0ff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow:
        0 0 12px #00f0ff,
        0 0 25px #00ffffaa;
      transition: all 0.3s ease;
      user-select: none;
    }

    .audio-control:hover {
      background: #00f0ff;
      color: #001122;
      box-shadow:
        0 0 25px #00ffff,
        0 0 45px #00ffffcc;
    }

    /* Responsive adjustments */
    @media (max-width: 420px) {
      .container {
        max-width: 90vw;
        padding: 30px 20px;
      }

      .image-container {
        width: 220px;
        height: 220px;
        margin-bottom: 30px;
      }

      .text {
        font-size: 2.8rem;
        letter-spacing: 5px;
      }

      .message {
        font-size: 1.3rem;
      }

      .emoji {
        font-size: 5rem;
      }

      .audio-control {
        font-size: 1rem;
        padding: 10px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Hacked by Eagle splash screen">
    <div class="image-container" aria-label="Eagle logo">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/White_Eagle_Poland.svg/1024px-White_Eagle_Poland.svg.png"
        alt="Eagle Logo"
        loading="lazy"
      />
      <div class="ring small"></div>
      <div class="ring medium"></div>
      <div class="ring large"></div>
      <div class="overlay-text">Made By Eagle</div>
    </div>

    <div class="message" aria-live="polite">This is just the beginning... 😂</div>
    <div class="text" aria-live="polite">Hacked By Eagle</div>
    <div class="emoji" aria-hidden="true">🦅🔥</div>

    <button class="audio-control" id="audioToggle" aria-pressed="true" aria-label="Toggle background music">Mute Music</button>

    <!-- Background music -->
    <audio id="bgAudio" autoplay loop>
      <source src="https://media1.vocaroo.com/mp3/1eYjADTAs7tm" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const audio = document.getElementById('bgAudio');
    const btn = document.getElementById('audioToggle');

    btn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = 'Mute Music';
        btn.setAttribute('aria-pressed', 'true');
      } else {
        audio.pause();
        btn.textContent = 'Play Music';
        btn.setAttribute('aria-pressed', 'false');
      }
    });
  </script>
</body>
</html>
